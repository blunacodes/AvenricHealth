name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, pdo_mysql, gd, opcache, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-all

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP CodeSniffer (Drupal coding standards)
        if: hashFiles('web/modules/custom/**/*.php', 'web/modules/custom/**/*.module', 'web/themes/custom/**/*.php', 'web/themes/custom/**/*.theme') != ''
        run: vendor/bin/phpcs

      - name: PHPStan static analysis
        if: hashFiles('web/modules/custom/**/*.php', 'web/modules/custom/**/*.module', 'web/themes/custom/**/*.php', 'web/themes/custom/**/*.theme') != ''
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Install Drupal site
        run: |
          if compgen -G "config/sync/*.yml" > /dev/null; then
            EXISTING_CONFIG=--existing-config
          else
            EXISTING_CONFIG=
          fi
          vendor/bin/drush site:install standard $EXISTING_CONFIG \
            --db-url=mysql://root:root@127.0.0.1/drupal \
            --site-name="Avenric Health CI" \
            --account-pass=admin \
            -y

      - name: Run PHPUnit
        if: hashFiles('web/modules/custom/**/tests/**') != ''
        run: vendor/bin/phpunit --configuration web/core
